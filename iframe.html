<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>響應式網站導覽</title>

    <style>
        /* ===== 全域設定 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Microsoft JhengHei",
                         "Noto Sans TC",
                         sans-serif;
            overflow: hidden;
        }

        /* ===== 整體布局 ===== */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ===== 左側導覽選單 ===== */
        .sidebar {
            flex: 0 0 260px;
            width: 260px;
            background: #79a1a0;
            color: white;
            padding: 20px 15px;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            line-height: 1.5;
        }

        .menu a:hover,
        .menu a:focus-visible {
            background: #5f8988;
            outline: none;
        }

        .menu a:active {
            background: #4f7776;
        }

        /* ===== 右側內容區 ===== */
        .content {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            background: #f4ffe6;
        }

        .content iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* ===== 平板版：601px 至 900px ===== */
        @media screen and (min-width: 601px) and (max-width: 900px) {
            .sidebar {
                flex-basis: 210px;
                width: 210px;
                padding: 16px 12px;
            }

            .sidebar h2 {
                font-size: 20px;
            }

            .menu a {
                padding: 12px 10px;
                font-size: 15px;
            }
        }

        /* ===== 手機版：600px 以下 ===== */
        @media screen and (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                flex: 0 0 auto;
                width: 100%;
                padding: 10px 12px;
                overflow: visible;
            }

            .sidebar h2 {
                margin-bottom: 10px;
                font-size: 19px;
            }

            /* 導覽選單改為橫向排列 */
            .menu {
                display: flex;
                flex-direction: row;
           width:100%；
                gap:4px；
                list-style:none；
            overfiow:visible；
                
            }

            .menu li {
                flex: 0 0 auto;
                margin-bottom: 0;
            }

            .menu a {
                padding: 10px 14px;
                font-size: 14px;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.12);
            }

            /* 內容區填滿剩餘高度 */
            .content {
                flex: 1 1 auto;
                width: 100%;
                min-width: 0;
                min-height: 0;
            }
        }

        /* ===== 減少動態效果 ===== */
        @media (prefers-reduced-motion: reduce) {
            .menu a {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 網站導覽選單 -->
        <nav class="sidebar" aria-label="網站導覽">

            <h2>網站導覽</h2>

            <ul class="menu">

                <li>
                    <a href="index.html" target="mainFrame">
                        首頁
                    </a>
                </li>

                <li>
                    <a href="b2.html" target="mainFrame">
                        特質問卷
                    </a>
                </li>

                <li>
                    <a
                        href="https://online.fliphtml5.com/nqsff/vrba/"
                        target="mainFrame">
                        電子書
                    </a>
                </li>

                <li>
                    <a href="b4.html" target="mainFrame">
                        周邊產品
                    </a>
                </li>

            </ul>

        </nav>

        <!-- 右側主要內容 -->
        <main class="content">

            <iframe
                name="mainFrame"
                src="index.html"
                title="網站主要內容">
            </iframe>

        </main>

    </div>

</body>
</html>
