
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>響應式網站導覽</title>

    <style>
        /* ===== 全域設定 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Microsoft JhengHei",
                         "Noto Sans TC",
                         sans-serif;
            overflow: hidden;
        }

        /* ===== 整體布局 ===== */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ===== 電腦版左側選單 ===== */
        .sidebar {
            flex: 0 0 260px;
            width: 260px;
            background: #79a1a0;
            color: white;
            padding: 20px 15px;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 10px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            line-height: 1.5;
            transition: background-color 0.2s ease;
        }

        .menu a:hover,
        .menu a:focus-visible {
            background: #5f8988;
        }

        .menu a:active {
            background: #4f7776;
        }

        /* ===== 右側內容區 ===== */
        .content {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            background: #f4ffe6;
        }

        .content iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* ===== 平板版：601px 至 900px ===== */
        @media screen and (min-width: 601px)
                       and (max-width: 900px) {

            .sidebar {
                flex-basis: 210px;
                width: 210px;
                padding: 16px 12px;
            }

            .sidebar h2 {
                font-size: 20px;
            }

            .menu a {
                padding: 12px 8px;
                font-size: 15px;
            }
        }

        /* ===== 手機版：600px 以下 ===== */
        @media screen and (max-width: 600px) {

            /* 改為上下排列 */
            .container {
                flex-direction: column;
            }

            /* 上方導覽區符合螢幕寬度 */
            .sidebar {
                flex: 0 0 auto;
                width: 100%;
                padding: 10px 8px;
                overflow: hidden;
            }

            .sidebar h2 {
                margin-bottom: 10px;
                font-size: 18px;
                text-align: center;
            }

            /* 四個選單平均分配寬度 */
            .menu {
                display: flex;
                flex-direction: row;
                width: 100%;
                gap: 4px;
                list-style: none;
                overflow: visible;
            }

            .menu li {
                flex: 1 1 0;
                min-width: 0;
                margin-bottom: 0;
            }

            /* 選單文字自動調整大小 */
            .menu a {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                min-height: 44px;
                padding: 8px 2px;
                font-size: clamp(11px, 3.2vw, 14px);
                line-height: 1.4;
                text-align: center;
                white-space: normal;
                overflow-wrap: anywhere;
                word-break: keep-all;
                border-radius: 6px;
                background: rgba(255, 255, 255, 0.12);
            }

            .menu a:hover,
            .menu a:focus-visible {
                background: #5f8988;
            }

            /* 下方內容填滿剩餘空間 */
            .content {
                flex: 1 1 auto;
                width: 100%;
                min-width: 0;
                min-height: 0;
            }

            .content iframe {
                display: block;
                width: 100%;
                height: 100%;
                border: none;
            }
        }

        /* ===== 減少動態效果 ===== */
        @media (prefers-reduced-motion: reduce) {
            .menu a {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 網站導覽選單 -->
        <nav class="sidebar" aria-label="網站導覽">

            <h2>網站導覽</h2>

            <ul class="menu">

                <li>
                    <a href="index.html" target="mainFrame">
                        首頁
                    </a>
                </li>

                <li>
                    <a href="b2.html" target="mainFrame">
                        特質問卷
                    </a>
                </li>

                <li>
                    <a
                        href="https://online.fliphtml5.com/nqsff/vrba/"
                        target="mainFrame">
                        電子書
                    </a>
                </li>

                <li>
                    <a href="b4.html" target="mainFrame">
                        周邊產品
                    </a>
                </li>

            </ul>

        </nav>

        <!-- 網頁主要內容 -->
        <main class="content">

            <iframe
                name="mainFrame"
                src="index.html"
                title="網站主要內容">
            </iframe>

        </main>

    </div>

</body>
</html>
