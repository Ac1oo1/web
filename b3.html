<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>你是甚麼特有種?</title>

<style>

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
    margin:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
}

.question{
    margin:20px 0;
    padding:15px;
    border-bottom:1px solid #ddd;
}

.options{
    margin-top:10px;
}

label{
    margin-right:18px;
    cursor:pointer;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#125aa0;
}

.result{
    margin-top:30px;
    padding:20px;
    background:#eef7ff;
    border-radius:8px;
    text-align:center;
    display:none;
}

.result h2{
    margin:0 0 8px 0;
    font-size:26px;
}

.result p{
    font-size:16px;
    line-height:1.6;
    color:#333;
    max-width:600px;
    margin:0 auto;
}

.result img{
    margin-top:20px;
    max-width:100%;
    width:500px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.25);
}

</style>

</head>


<body>

<div class="container">

<h1>你是甚麼特有種?</h1>

<div id="survey"></div>

<button onclick="calculateScore()">查看角色</button>


<div class="result" id="result">

    <h2 id="resultTitle"></h2>

    <p id="resultText"></p>

    <img id="resultImage" src="" alt="結果圖片">

</div>

</div>


<script>


// ========================================
// 題目
// ========================================

const questions = [

"比起離群索居，你更喜歡與同類互相照應",

"你享受獨自探索棲地外的環境，而非待在舒適圈",

"面對天敵時，你通常感到慌亂，難以專注思考策略",

"在與同伴相處時，你會優先考慮他人的處境，而不是自掃門前雪",

"你熱衷與同伴互相幫助",

"你不太在意自己是否會給新成員留下好印象。",

"你時常擔心自己會遭到天敵追獵",

"你不喜歡在族群中擔任領導者",

"你經常等到危險到來時才後悔莫及",

"你通常以正面心態看事情",

"做決定時，你會為長遠情況作出判斷，而非一時的突發狀況",

"對於探討未來或杞人憂天話題，你通常興趣不大"

];


// ========================================
// 反向計分
// ========================================

// 0 = 第1題
// 1 = 第2題
// 2 = 第3題
// 3 = 第4題
// 4 = 第5題
// 5 = 第6題
// 6 = 第7題
// 7 = 第8題
// 8 = 第9題
// 9 = 第10題
// 10 = 第11題
// 11 = 第12題

const REVERSE_ITEMS = [2, 5, 7, 8, 11];


// ========================================
// 結果
// 只設定 12～18 分
// 圖片直接放在 index.html 同一層
// ========================================

const RESULTS = {

    12: {
        image: "a12.png",
        title: "朱氏隱姬花天牛",
        text: "X。"
    },

    13: {
        image: "a13.png",
        title: "金絲蛇",
        text: "主要分布於北部500至1000的山區潮濕環境，以蛙類、蝌蚪為食，日行性，卵生。"
    },

    14: {
        image: "a14.png",
        title: "斯文豪氏攀蜥",
        text: "X"
    },

    15: {
        image: "a15.png",
        title: "台灣寬尾鳳蝶",
        text: "分布海拔1000至2000山區，幼蟲以台灣檫樹樹葉為食，雄性成蟲吸水，雌性成蟲在台灣檫樹產卵或附近訪花(吸花蜜)。"
    },

    16: {
        image: "a16.png",
        title: "橙腹樹蛙",
        text: "中低海拔的森林環境，繁殖期以春夏兩季為主，蝌蚪主食為藻類、落葉，成蛙主食為小型無脊椎動物。"
    },

    17: {
        image: "a17.png",
        title: "蘭嶼大葉螽",
        text: "X"
    },

    18: {
        image: "a18.png",
        title: "蘭嶼筒胸竹節蟲",
        text: "請填入18分的說明。"
    }

};


// ========================================
// 建立題目
// ========================================

const survey = document.getElementById("survey");

let html = "";


questions.forEach((q, index) => {

    html += `
    <div class="question">

        <b>第${index + 1}題：</b>${q}

        <div class="options">
    `;


    for(let i = 1; i <= 4; i++){

        let text = "";


        switch(i){

            case 1:
                text = "不同意";
                break;

            case 2:
                text = "有點不同意";
                break;

            case 3:
                text = "有點同意";
                break;

            case 4:
                text = "同意";
                break;

        }


        html += `
        <label>

            <input
                type="radio"
                name="q${index}"
                value="${i}"
            >

            ${i} ${text}

        </label>
        `;

    }


    html += `
        </div>

    </div>
    `;

});


survey.innerHTML = html;


// ========================================
// 計算分數
// ========================================

function calculateScore(){

    let total = 0;


    // 檢查所有題目
    for(let i = 0; i < questions.length; i++){

        const ans = document.querySelector(
            `input[name="q${i}"]:checked`
        );


        // 有題目沒有回答
        if(!ans){

            alert("還有沒作答的o，仔細檢查看看?");

            return;

        }


        let value = Number(ans.value);


        // 反向計分
        if(REVERSE_ITEMS.includes(i)){

            value = 5 - value;

        }


        total += value;

    }


    // ========================================
    // 取得結果
    // ========================================

    const result = RESULTS[total];


    // 如果分數不是 12～18
    if(!result){

        alert("你的分數目前不在12～18分的結果範圍內。");

        return;

    }


    // ========================================
    // 顯示結果
    // ========================================

    document.getElementById("resultTitle").textContent =
        result.title;


    document.getElementById("resultText").textContent =
        result.text;


    document.getElementById("resultImage").src =
        result.image;


    document.getElementById("resultImage").alt =
        result.title;


    document.getElementById("result").style.display =
        "block";


    // 自動滑到結果
    document.getElementById("result").scrollIntoView({
        behavior:"smooth"
    });

}

</script>

</body>

</html>
