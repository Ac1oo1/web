<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
>

<title>3D 翻書圖片瀏覽器</title>

<style>

/* =====================================================
   全域設定
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background:
        radial-gradient(
            ellipse at center,
            #5b4638 0%,
            #30251f 55%,
            #17110e 100%
        );

    user-select: none;
    overscroll-behavior: none;
}


/* =====================================================
   主畫面
===================================================== */

#viewer {
    position: relative;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 2600px;

    overflow: hidden;
}


/* 桌面光影 */

#viewer::before {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 38%,
            rgba(255, 255, 255, 0.13),
            transparent 46%
        );
}


/* =====================================================
   書本容器
===================================================== */

.book {
    position: relative;

    width: min(92vw, 1500px);
    height: min(82vh, 900px);

    display: flex;

    transform-style: preserve-3d;

    filter:
        drop-shadow(0 35px 30px rgba(0, 0, 0, 0.48))
        drop-shadow(0 12px 10px rgba(0, 0, 0, 0.38));
}


/* 書本底部厚度 */

.book::before {
    content: "";

    position: absolute;

    left: 1.2%;
    right: 1.2%;
    bottom: -14px;

    height: 22px;

    border-radius: 0 0 12px 12px;

    background:
        repeating-linear-gradient(
            0deg,
            #d8d2c8 0px,
            #d8d2c8 2px,
            #b9b1a4 3px,
            #f0ece5 4px
        );

    box-shadow:
        0 8px 12px rgba(0, 0, 0, 0.4);

    transform: translateZ(-10px);
}


/* =====================================================
   左右固定頁面
===================================================== */

.page {
    position: relative;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            #f4f0e8,
            #fffdf8
        );

    transform-style: preserve-3d;
    backface-visibility: hidden;
}


/* 左頁 */

.left-page {
    border-radius: 16px 2px 2px 16px;

    box-shadow:
        inset -22px 0 35px rgba(0, 0, 0, 0.15),
        inset 7px 0 12px rgba(255, 255, 255, 0.65);
}


/* 左頁連續漂移：避免翻頁完成瞬間有停頓感 */
.left-page {
    will-change: transform, opacity, filter;
    transform: translate3d(0,0,0);
}

.left-page.left-flow-next {
    animation: leftFlowNext 1080ms cubic-bezier(0.16, 0.84, 0.26, 1) both;
}

.left-page.left-flow-prev {
    animation: leftFlowPrev 1080ms cubic-bezier(0.16, 0.84, 0.26, 1) both;
}

@keyframes leftFlowNext {
    0%   { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
    36%  { transform: translate3d(-0.35%, -1px, 0) scale(0.999); filter: brightness(0.985); }
    58%  { transform: translate3d(-0.8%, -2px, 0) scale(0.997); filter: brightness(0.97); }
    78%  { transform: translate3d(-0.25%, -1px, 0) scale(0.999); filter: brightness(0.99); }
    100% { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
}

@keyframes leftFlowPrev {
    0%   { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
    28%  { transform: translate3d(0.45%, -1px, 0) scale(0.999); filter: brightness(0.985); }
    55%  { transform: translate3d(0.75%, -2px, 0) scale(0.997); filter: brightness(0.97); }
    82%  { transform: translate3d(0.2%, -1px, 0) scale(0.999); filter: brightness(0.99); }
    100% { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
}

/* 右頁 */

.right-page {
    border-radius: 2px 16px 16px 2px;

    box-shadow:
        inset 22px 0 35px rgba(0, 0, 0, 0.15),
        inset -7px 0 12px rgba(255, 255, 255, 0.65);
}


/* 頁面圖片 */

.page img,
.sheet-face img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;

    background:
        linear-gradient(
            135deg,
            #f7f3eb,
            #fff
        );

    pointer-events: none;
    -webkit-user-drag: none;
}


/* 空白頁 */

.blank-page {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #a69e92;

    font-size: 20px;

    background:
        linear-gradient(
            135deg,
            #eee9df,
            #fffdf8 50%,
            #eee9df
        );
}


/* =====================================================
   中央書脊
===================================================== */

.book-spine {
    position: absolute;

    top: 0;
    bottom: 0;
    left: 50%;

    z-index: 50;

    width: 42px;

    transform: translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0, 0, 0, 0.08) 10%,
            rgba(0, 0, 0, 0.28) 42%,
            rgba(0, 0, 0, 0.42) 49%,
            rgba(255, 255, 255, 0.11) 53%,
            rgba(0, 0, 0, 0.22) 62%,
            rgba(0, 0, 0, 0.08) 88%,
            transparent 100%
        );

    filter: blur(1.5px);
}


/* 書脊底部陰影 */

.book-spine::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -20px;

    width: 80px;
    height: 28px;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(0, 0, 0, 0.6),
            transparent 70%
        );
}


/* =====================================================
   翻動紙張
===================================================== */

.turning-sheet {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    z-index: 30;

    display: none;

    transform-style: preserve-3d;

    will-change: transform;
}


/* 紙張正反兩面 */

.sheet-face {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    backface-visibility: hidden;

    background:
        linear-gradient(
            135deg,
            #f4efe6,
            #fff
        );
}


/* 紙張正面 */

.sheet-front {
    z-index: 2;
}


/* 紙張背面 */

.sheet-back {
    transform: rotateY(180deg);

    box-shadow:
        inset 18px 0 30px rgba(0, 0, 0, 0.13);
}


/* 翻頁過程中的下一張預覽：在紙張接近書脊前先淡淡浮現，避免 90 度後才突然看到新圖 */
.sheet-preview {
    position: absolute;
    inset: 0;
    z-index: 4;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    pointer-events: none;
    backface-visibility: hidden;
    transform: translateX(10px) scale(0.998);
}

.turn-next .sheet-preview {
    animation: previewNext 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

.turn-prev .sheet-preview {
    animation: previewPrev 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

@keyframes previewNext {
    0%, 25% { opacity: 0; transform: translateX(14px) scale(0.998); }
    38% { opacity: 0.12; }
    48% { opacity: 0.38; transform: translateX(4px) scale(1); }
    54% { opacity: 0.18; }
    58%, 100% { opacity: 0; transform: translateX(0) scale(1); }
}

@keyframes previewPrev {
    0%, 25% { opacity: 0; transform: translateX(-14px) scale(0.998); }
    38% { opacity: 0.12; }
    48% { opacity: 0.38; transform: translateX(-4px) scale(1); }
    54% { opacity: 0.18; }
    58%, 100% { opacity: 0; transform: translateX(0) scale(1); }
}

/* 紙張光影 */

.sheet-light {
    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    opacity: 0;

    backface-visibility: hidden;

    background:
        linear-gradient(
            105deg,
            transparent 12%,
            rgba(255, 255, 255, 0.08) 34%,
            rgba(255, 255, 255, 0.72) 50%,
            rgba(0, 0, 0, 0.14) 71%,
            transparent 92%
        );

    mix-blend-mode: screen;
}


/* 紙張邊緣 */

.sheet-edge {
    position: absolute;

    top: 0;
    bottom: 0;

    z-index: 12;

    width: 9px;

    opacity: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            #8b847a,
            #fff,
            #999186
        );

    box-shadow:
        0 0 18px rgba(0, 0, 0, 0.6);
}


/* =====================================================
   流暢翻頁：帶輕微漂移、抬升與落頁感
===================================================== */

.turn-next,
.turn-prev {
    display: block;
    will-change: transform, filter, box-shadow;
}

.turn-next {
    right: 0;
    transform-origin: left center;
    animation: turnNext 1080ms cubic-bezier(0.16, 0.84, 0.26, 1) forwards;
}

.turn-prev {
    left: 0;
    transform-origin: right center;
    animation: turnPrev 1080ms cubic-bezier(0.16, 0.84, 0.26, 1) forwards;
}

.turn-next .sheet-front {
    border-radius: 2px 16px 16px 2px;
    box-shadow: inset 20px 0 28px rgba(0, 0, 0, 0.10);
}

.turn-next .sheet-back {
    border-radius: 16px 2px 2px 16px;
}

.turn-prev .sheet-front {
    border-radius: 16px 2px 2px 16px;
    box-shadow: inset -20px 0 28px rgba(0, 0, 0, 0.10);
}

.turn-prev .sheet-back {
    border-radius: 2px 16px 16px 2px;
}

.turn-next .sheet-edge {
    right: -4px;
    animation: edgeNext 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

.turn-prev .sheet-edge {
    left: -4px;
    animation: edgePrev 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

.turn-next .sheet-light {
    animation: lightNext 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

.turn-prev .sheet-light {
    animation: lightPrev 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

/* 往下一頁：右頁向左翻，附帶小幅左漂移與上浮 */
@keyframes turnNext {
    0% {
        transform: translateX(0) translateY(0) translateZ(1px)
                   rotateY(0deg) rotateZ(0deg) scale(1);
        filter: brightness(1);
        box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    10% {
        transform: translateX(-0.5%) translateY(-1px) translateZ(10px)
                   rotateY(-8deg) rotateZ(-0.05deg) scale(1.002);
        filter: brightness(1.025);
        box-shadow: 10px 3px 18px rgba(0,0,0,0.12);
    }
    28% {
        transform: translateX(-2.2%) translateY(-4px) translateZ(28px)
                   rotateY(-38deg) rotateZ(-0.18deg) scale(1.006);
        filter: brightness(1.015);
        box-shadow: 28px 7px 42px rgba(0,0,0,0.25);
    }
    50% {
        transform: translateX(-4.8%) translateY(-7px) translateZ(52px)
                   rotateY(-92deg) rotateZ(-0.32deg) scale(1.01);
        filter: brightness(0.83);
        box-shadow: 55px 10px 72px rgba(0,0,0,0.45);
    }
    70% {
        transform: translateX(-3.3%) translateY(-4px) translateZ(30px)
                   rotateY(-142deg) rotateZ(-0.16deg) scale(1.006);
        filter: brightness(0.86);
        box-shadow: 32px 7px 48px rgba(0,0,0,0.30);
    }
    88% {
        transform: translateX(-1.0%) translateY(-1px) translateZ(9px)
                   rotateY(-173deg) rotateZ(-0.04deg) scale(1.002);
        filter: brightness(0.94);
        box-shadow: 9px 3px 18px rgba(0,0,0,0.14);
    }
    100% {
        transform: translateX(0) translateY(0) translateZ(1px)
                   rotateY(-180deg) rotateZ(0deg) scale(1);
        filter: brightness(0.98);
        box-shadow: 0 0 0 rgba(0,0,0,0);
    }
}

/* 往上一頁：鏡像漂移 */
@keyframes turnPrev {
    0% {
        transform: translateX(0) translateY(0) translateZ(1px)
                   rotateY(0deg) rotateZ(0deg) scale(1);
        filter: brightness(1);
        box-shadow: 0 0 0 rgba(0,0,0,0);
    }
    10% {
        transform: translateX(0.5%) translateY(-1px) translateZ(10px)
                   rotateY(8deg) rotateZ(0.05deg) scale(1.002);
        filter: brightness(1.025);
        box-shadow: -10px 3px 18px rgba(0,0,0,0.12);
    }
    28% {
        transform: translateX(2.2%) translateY(-4px) translateZ(28px)
                   rotateY(38deg) rotateZ(0.18deg) scale(1.006);
        filter: brightness(1.015);
        box-shadow: -28px 7px 42px rgba(0,0,0,0.25);
    }
    50% {
        transform: translateX(4.8%) translateY(-7px) translateZ(52px)
                   rotateY(92deg) rotateZ(0.32deg) scale(1.01);
        filter: brightness(0.83);
        box-shadow: -55px 10px 72px rgba(0,0,0,0.45);
    }
    70% {
        transform: translateX(3.3%) translateY(-4px) translateZ(30px)
                   rotateY(142deg) rotateZ(0.16deg) scale(1.006);
        filter: brightness(0.86);
        box-shadow: -32px 7px 48px rgba(0,0,0,0.30);
    }
    88% {
        transform: translateX(1.0%) translateY(-1px) translateZ(9px)
                   rotateY(173deg) rotateZ(0.04deg) scale(1.002);
        filter: brightness(0.94);
        box-shadow: -9px 3px 18px rgba(0,0,0,0.14);
    }
    100% {
        transform: translateX(0) translateY(0) translateZ(1px)
                   rotateY(180deg) rotateZ(0deg) scale(1);
        filter: brightness(0.98);
        box-shadow: 0 0 0 rgba(0,0,0,0);
    }
}

@keyframes lightNext {
    0%   { opacity: 0;    transform: translateX(90%); }
    22%  { opacity: 0.24; }
    48%  { opacity: 0.68; transform: translateX(2%); }
    72%  { opacity: 0.22; }
    100% { opacity: 0;    transform: translateX(-85%); }
}

@keyframes lightPrev {
    0%   { opacity: 0;    transform: translateX(-90%); }
    22%  { opacity: 0.24; }
    48%  { opacity: 0.68; transform: translateX(-2%); }
    72%  { opacity: 0.22; }
    100% { opacity: 0;    transform: translateX(85%); }
}

@keyframes edgeNext {
    0%   { opacity: 0;    transform: scaleX(0.45); }
    28%  { opacity: 0.45; }
    50%  { opacity: 0.9;  transform: scaleX(1.55); }
    76%  { opacity: 0.28; }
    100% { opacity: 0;    transform: scaleX(0.45); }
}

@keyframes edgePrev {
    0%   { opacity: 0;    transform: scaleX(0.45); }
    28%  { opacity: 0.45; }
    50%  { opacity: 0.9;  transform: scaleX(1.55); }
    76%  { opacity: 0.28; }
    100% { opacity: 0;    transform: scaleX(0.45); }
}



/* =====================================================
   自然翻頁交接：翻越書脊後不再殘留前一頁
   - 前頁影像在接近 90° 前快速、柔和地淡出
   - 後頁影像在越過書脊後才自然淡入
   - 避免翻頁快完成時仍看見上一張圖
===================================================== */

.turn-next .sheet-front > img:not(.sheet-preview),
.turn-prev .sheet-front > img:not(.sheet-preview) {
    animation: oldPageDisappear 1080ms cubic-bezier(0.18, 0.78, 0.25, 1) forwards;
    will-change: opacity, filter, transform;
}

.turn-next .sheet-back > img,
.turn-prev .sheet-back > img {
    opacity: 0;
    animation: newPageReveal 1080ms cubic-bezier(0.18, 0.78, 0.25, 1) forwards;
    will-change: opacity, filter, transform;
}

@keyframes oldPageDisappear {
    0%   { opacity: 1;    filter: brightness(1) blur(0);   transform: scale(1); }
    28%  { opacity: 0.98; filter: brightness(0.99) blur(0); transform: scale(1.001); }
    40%  { opacity: 0.82; filter: brightness(0.94) blur(0.15px); transform: scale(1.002); }
    48%  { opacity: 0.42; filter: brightness(0.86) blur(0.45px); transform: scale(1.003); }
    54%  { opacity: 0.10; filter: brightness(0.78) blur(0.8px); transform: scale(1.004); }
    58%, 100% { opacity: 0; filter: brightness(0.74) blur(1px); transform: scale(1.004); }
}

@keyframes newPageReveal {
    0%, 48% { opacity: 0; filter: brightness(0.82) blur(0.8px); transform: scale(0.997); }
    54% { opacity: 0.14; filter: brightness(0.88) blur(0.55px); transform: scale(0.998); }
    62% { opacity: 0.55; filter: brightness(0.95) blur(0.22px); transform: scale(0.999); }
    74% { opacity: 0.88; filter: brightness(0.99) blur(0); transform: scale(1); }
    86%, 100% { opacity: 1; filter: brightness(1) blur(0); transform: scale(1); }
}

/* 下一頁預覽只保留非常淡的提示，不讓它和舊頁混在一起太久 */
@keyframes previewNext {
    0%, 34% { opacity: 0; transform: translateX(10px) scale(0.998); }
    43% { opacity: 0.08; }
    49% { opacity: 0.16; transform: translateX(2px) scale(1); }
    54% { opacity: 0.06; }
    57%, 100% { opacity: 0; transform: translateX(0) scale(1); }
}

@keyframes previewPrev {
    0%, 34% { opacity: 0; transform: translateX(-10px) scale(0.998); }
    43% { opacity: 0.08; }
    49% { opacity: 0.16; transform: translateX(-2px) scale(1); }
    54% { opacity: 0.06; }
    57%, 100% { opacity: 0; transform: translateX(0) scale(1); }
}

/* =====================================================
   左右點擊區域
===================================================== */

.click-zone {
    position: fixed;

    top: 0;
    bottom: 0;

    width: 16vw;

    z-index: 80;

    cursor: pointer;

    display: flex;
    align-items: center;

    opacity: 0;

    transition: opacity 0.25s ease;
}

.click-zone:hover {
    opacity: 1;
}

.click-zone::after {
    width: 48px;
    height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    font-size: 38px;

    background: rgba(0, 0, 0, 0.35);

    border: 1px solid rgba(255, 255, 255, 0.2);

    backdrop-filter: blur(8px);

    box-shadow:
        0 7px 22px rgba(0, 0, 0, 0.38);
}

.left-zone {
    left: 0;

    justify-content: flex-start;

    background:
        linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.35),
            transparent
        );
}

.left-zone::after {
    content: "‹";

    margin-left: 14px;

    border-radius: 0 12px 12px 0;
}

.right-zone {
    right: 0;

    justify-content: flex-end;

    background:
        linear-gradient(
            270deg,
            rgba(0, 0, 0, 0.35),
            transparent
        );
}

.right-zone::after {
    content: "›";

    margin-right: 14px;

    border-radius: 12px 0 0 12px;
}


/* =====================================================
   控制列
===================================================== */

.controls {
    position: fixed;

    left: 50%;
    bottom: 18px;

    z-index: 100;

    transform: translateX(-50%);

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 9px 14px;

    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;

    background: rgba(20, 15, 12, 0.72);

    backdrop-filter: blur(12px);

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

button {
    min-width: 120px;

    padding: 11px 18px;

    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 9px;

    color: white;

    font-size: 16px;
    font-weight: bold;

    background:
        linear-gradient(
            180deg,
            #8a623f,
            #5e3f28
        );

    box-shadow:
        0 5px 12px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        filter 0.2s ease,
        opacity 0.2s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);

    filter: brightness(1.15);
}

button:active:not(:disabled) {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

#pageNo {
    min-width: 120px;

    color: white;

    text-align: center;

    font-size: 17px;
    font-weight: bold;

    text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.8);
}


/* 操作提示 */

.help-text {
    position: fixed;

    top: 14px;
    left: 50%;

    z-index: 100;

    transform: translateX(-50%);

    padding: 7px 15px;

    color: rgba(255, 255, 255, 0.88);

    font-size: 13px;

    border-radius: 20px;

    background: rgba(20, 15, 12, 0.58);

    backdrop-filter: blur(8px);

    pointer-events: none;

    transition: opacity 0.5s ease;
}


/* =====================================================
   手機版
===================================================== */

@media (max-width: 800px) {

    .book {
        width: 96vw;
        height: 72vh;
    }

    .controls {
        width: calc(100% - 20px);

        bottom: 10px;

        gap: 7px;

        padding: 7px 8px;
    }

    button {
        min-width: 0;

        flex: 1;

        padding: 10px 7px;

        font-size: 14px;
    }

    #pageNo {
        min-width: 90px;

        font-size: 14px;
    }

    .click-zone {
        width: 11vw;
    }

    .click-zone::after {
        display: none;
    }

    .book-spine {
        width: 25px;
    }

    .help-text {
        width: calc(100% - 24px);

        top: 8px;

        text-align: center;

        font-size: 11px;
    }
}


/* 手機直向時增加書本高度 */

@media (
    max-width: 650px
) and (
    orientation: portrait
) {

    .book {
        width: 98vw;
        height: 60vh;
    }
}


/* 減少動畫設定 */


/* =====================================================
   自然帶出下一頁：下一頁固定在翻頁紙張背面
   紙張越過書脊時直接跟著翻出，不等定位後才切換
===================================================== */
.turn-next .sheet-front > img:not(.sheet-preview) {
    animation: carryFrontOut 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
}

.turn-next .sheet-back > img {
    animation: carryNextIn 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
    transform-origin: left center;
}

@keyframes carryFrontOut {
    0%, 34% { opacity: 1; filter: brightness(1) blur(0); }
    46% { opacity: .88; filter: brightness(.94) blur(.15px); }
    52% { opacity: .40; filter: brightness(.82) blur(.35px); }
    57%, 100% { opacity: 0; filter: brightness(.76) blur(.5px); }
}

@keyframes carryNextIn {
    0%, 38% {
        opacity: 0;
        transform: translateX(18px) scale(.992);
        filter: brightness(.72) blur(.6px);
    }
    46% {
        opacity: .18;
        transform: translateX(12px) scale(.994);
        filter: brightness(.78) blur(.45px);
    }
    51% {
        opacity: .52;
        transform: translateX(7px) scale(.997);
        filter: brightness(.86) blur(.25px);
    }
    58% {
        opacity: .86;
        transform: translateX(3px) scale(.999);
        filter: brightness(.94) blur(.08px);
    }
    66%, 100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: brightness(1) blur(0);
    }
}

/* 舊的中央預覽只保留很淡的引導，不再讓它看起來像另一張獨立圖片 */
.turn-next .sheet-preview {
    animation: carryPreviewHint 1080ms ease-out forwards;
}
@keyframes carryPreviewHint {
    0%, 36% { opacity: 0; }
    46% { opacity: .08; }
    52% { opacity: .12; }
    58%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {

    .turn-next,
    .turn-prev,
    .turn-next .sheet-light,
    .turn-prev .sheet-light,
    .turn-next .sheet-edge,
    .turn-prev .sheet-edge {
        animation-duration: 400ms;
    }
}



/* =====================================================
   單頁封面模式：0.png
===================================================== */
.book.cover-mode {
    width: min(46vw, 750px);
}

.book.cover-mode .left-page {
    display: none;
}

.book.cover-mode .right-page {
    width: 100%;
    border-radius: 16px;
    box-shadow:
        inset 10px 0 24px rgba(0,0,0,0.10),
        inset -10px 0 24px rgba(0,0,0,0.10);
}

.book.cover-mode .book-spine {
    display: none;
}

.book.cover-mode::before {
    left: 1.2%;
    right: 1.2%;
}

.book.cover-mode .turning-sheet {
    width: 100%;
    right: 0;
    left: auto;
}

.book.cover-mode .turn-next {
    transform-origin: left center;
}

/* 封面打開時，讓書本平順展開成雙頁寬度 */
.book.opening-cover {
    animation: openBookWidth 1250ms cubic-bezier(0.22,0.61,0.36,1) forwards;
}

@keyframes openBookWidth {
    from { width: min(46vw, 750px); }
    to   { width: min(92vw, 1500px); }
}

/* 從第一組內頁退回封面時，書本收合 */
.book.closing-cover {
    animation: closeBookWidth 1250ms cubic-bezier(0.22,0.61,0.36,1) forwards;
}

@keyframes closeBookWidth {
    from { width: min(92vw, 1500px); }
    to   { width: min(46vw, 750px); }
}

@media (max-width: 800px) {
    .book.cover-mode { width: 48vw; }
    @keyframes openBookWidth {
        from { width: 48vw; }
        to   { width: 96vw; }
    }
    @keyframes closeBookWidth {
        from { width: 96vw; }
        to   { width: 48vw; }
    }
}



/* =====================================================
   右側下一頁預先鋪在翻頁紙張下方
   - 下一組右頁在翻頁開始前就已經定位
   - 不做延遲換圖或淡入，紙張一掀起就直接露出
   - 只加入極輕微亮度/縮放回復，避免視覺僵硬
===================================================== */
.right-page.right-under-next img {
    opacity: 1 !important;
    animation: rightUnderReveal 1080ms cubic-bezier(0.22, 0.72, 0.28, 1) forwards;
    will-change: transform, filter;
}

@keyframes rightUnderReveal {
    0%   { opacity: 1; transform: translateX(-3px) scale(1.003); filter: brightness(0.90); }
    30%  { opacity: 1; transform: translateX(-2px) scale(1.002); filter: brightness(0.93); }
    52%  { opacity: 1; transform: translateX(-1px) scale(1.001); filter: brightness(0.97); }
    72%, 100% { opacity: 1; transform: translateX(0) scale(1); filter: brightness(1); }
}



/* =====================================================
   翻頁後圖片「飛入」顯示效果
   下一頁：由右上方快速飛入並柔和減速定位
   上一頁：由左上方反向飛入
===================================================== */
.page img.fly-in-next {
    animation: flyInNext 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
    transform-origin: center center;
    will-change: transform, opacity, filter;
}
.page img.fly-in-prev {
    animation: flyInPrev 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
    transform-origin: center center;
    will-change: transform, opacity, filter;
}

@keyframes flyInNext {
    0% {
        opacity: 0;
        transform: translate3d(105px, -34px, 45px) scale(0.92) rotateZ(1.4deg);
        filter: blur(3px) brightness(1.08);
    }
    42% {
        opacity: 0.78;
        transform: translate3d(30px, -10px, 18px) scale(0.975) rotateZ(0.45deg);
        filter: blur(1px) brightness(1.03);
    }
    78% {
        opacity: 1;
        transform: translate3d(-5px, 1px, 2px) scale(1.006) rotateZ(-0.08deg);
        filter: blur(0) brightness(1);
    }
    100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotateZ(0);
        filter: blur(0) brightness(1);
    }
}

@keyframes flyInPrev {
    0% {
        opacity: 0;
        transform: translate3d(-105px, -34px, 45px) scale(0.92) rotateZ(-1.4deg);
        filter: blur(3px) brightness(1.08);
    }
    42% {
        opacity: 0.78;
        transform: translate3d(-30px, -10px, 18px) scale(0.975) rotateZ(-0.45deg);
        filter: blur(1px) brightness(1.03);
    }
    78% {
        opacity: 1;
        transform: translate3d(5px, 1px, 2px) scale(1.006) rotateZ(0.08deg);
        filter: blur(0) brightness(1);
    }
    100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotateZ(0);
        filter: blur(0) brightness(1);
    }
}

</style>
</head>

<body>

<div id="viewer">

    <div class="book cover-mode" id="book">

        <!-- 固定左頁 -->
        <div class="page left-page">
            <img
                id="leftPhoto"
                src=""
                alt="左頁"
                draggable="false"
            >
        </div>

        <!-- 固定右頁 -->
        <div class="page right-page">
            <img
                id="rightPhoto"
                src="0.png"
                alt="右頁"
                draggable="false"
            >
        </div>

        <!-- 翻動紙張 -->
        <div
            class="turning-sheet"
            id="turningSheet"
        >

            <!-- 紙張正面 -->
            <div class="sheet-face sheet-front">
                <img
                    id="sheetFrontPhoto"
                    src="0.png"
                    alt=""
                    draggable="false"
                >
                <img
                    id="sheetPreviewPhoto"
                    class="sheet-preview"
                    src="1.png"
                    alt=""
                    draggable="false"
                >

                <div class="sheet-light"></div>
                <div class="sheet-edge"></div>
            </div>

            <!-- 紙張背面 -->
            <div class="sheet-face sheet-back">
                <img
                    id="sheetBackPhoto"
                    src="1.png"
                    alt=""
                    draggable="false"
                >
            </div>

        </div>

        <!-- 書脊 -->
        <div class="book-spine"></div>

    </div>

</div>


<!-- 左右點擊區 -->
<div
    class="click-zone left-zone"
    id="leftZone"
    title="翻到上一組"
></div>

<div
    class="click-zone right-zone"
    id="rightZone"
    title="翻到下一組"
></div>


<!-- 操作提示 -->
<div class="help-text" id="helpText">
    可使用左右鍵、滑鼠滾輪、拖曳或手機滑動翻書
</div>


<!-- 控制列 -->
<div class="controls">

    <button
        id="prevButton"
        type="button"
    >
        ◀ 上一頁
    </button>

    <span id="pageNo">
        封面 / 17
    </span>

    <button
        id="nextButton"
        type="button"
    >
        下一頁 ▶
    </button>

</div>


<script>
/* =====================================================
   圖片清單
   0.png = 單頁封面
   1.png 起 = 每兩張為一組雙面內頁
===================================================== */
const coverImage = "0.png";

const innerImages = [
    "1.png", "2.png",
    "3.png", "4.png",
    "5.png", "6.png",
    "7.png", "8.png",
    "9.png", "10.png",
    "11.png", "12.png",
    "13.png", "14.png",
     "15.png", "16.png",
    "17.png", "18.png",
    "19.png", "20.png",
    "21.png", "22.png",
    "23.png", "24.png",
    "25.png", "26.png",
    "27.png", "28.png",
    "29.png", "30.png",
    "31.png", "32.png",
    "33.png", "34.png",
    "35.png", "36.png",
    "37.png", "38.png",
    "39.png", "40.png",
    "41.png", "42.png",
    "43.png", "44.png",
    "45.png", "46.png",
    "47.png", "48.png"
];

const animationDuration = 1080;

/*
viewIndex = 0  -> 封面 0.png
viewIndex = 1  -> 1.png + 2.png
viewIndex = 2  -> 3.png + 4.png
...
*/
let viewIndex = 0;
let isAnimating = false;
let wheelLocked = false;
let touchStartX = 0;
let touchStartY = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let isPointerDown = false;

const book = document.getElementById("book");
const leftPhoto = document.getElementById("leftPhoto");
const rightPhoto = document.getElementById("rightPhoto");
const turningSheet = document.getElementById("turningSheet");
const sheetFrontPhoto = document.getElementById("sheetFrontPhoto");
const sheetPreviewPhoto = document.getElementById("sheetPreviewPhoto");
const sheetBackPhoto = document.getElementById("sheetBackPhoto");
const prevButton = document.getElementById("prevButton");
const nextButton = document.getElementById("nextButton");
const pageNo = document.getElementById("pageNo");
const leftZone = document.getElementById("leftZone");
const rightZone = document.getElementById("rightZone");
const helpText = document.getElementById("helpText");

const blankPage =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400">
            <defs>
                <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#eee9df"/>
                    <stop offset="50%" stop-color="#fffdf8"/>
                    <stop offset="100%" stop-color="#eee9df"/>
                </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#paper)"/>
        </svg>
    `);

function setImage(img, src) {
    const finalSrc = src || blankPage;

    // 避免重複指定相同圖片造成瀏覽器重新繪製而產生閃動
    if (img.dataset.pageSrc === finalSrc) {
        img.style.display = "block";
        return;
    }

    img.src = finalSrc;
    img.dataset.pageSrc = finalSrc;
    img.style.display = "block";
    img.style.opacity = "1";
    img.style.transform = "translateX(0) scale(1)";
}

/*
 * 柔和換圖：保留舊圖做短暫疊影，再讓新圖淡入。
 * 這樣翻頁跨過書脊時，底層前後頁不會突然跳成另一張圖。
 */
function crossfadeImage(img, src, direction = "next", duration = 700) {
    const finalSrc = src || blankPage;

    if (img.dataset.pageSrc === finalSrc) return;

    const parent = img.parentElement;
    if (!parent) {
        setImage(img, src);
        return;
    }

    // 清除前一次尚未完成的轉場殘影
    parent.querySelectorAll(".page-swap-clone").forEach(el => el.remove());

    // 保留目前頁面，讓它先慢慢淡化消失
    const oldImg = img.cloneNode(false);
    oldImg.removeAttribute("id");
    oldImg.className = "page-swap-clone";
    oldImg.style.position = "absolute";
    oldImg.style.inset = "0";
    oldImg.style.width = "100%";
    oldImg.style.height = "100%";
    oldImg.style.objectFit = "contain";
    oldImg.style.pointerEvents = "none";
    oldImg.style.zIndex = "7";
    oldImg.style.opacity = "1";
    oldImg.style.transform = "translateX(0) scale(1)";
    parent.appendChild(oldImg);

    // 下一頁先放到底層，但保持透明；等前一頁淡掉後才開始顯示
    img.src = finalSrc;
    img.dataset.pageSrc = finalSrc;
    img.style.display = "block";
    img.style.opacity = "0";

    const offset = direction === "next" ? 8 : -8;

    // 前一頁：0~62% 慢慢淡化，最後完全消失
    const oldAnim = oldImg.animate(
        [
            { opacity: 1, transform: "translateX(0) scale(1)", filter: "brightness(1) blur(0px)", offset: 0 },
            { opacity: 0.62, transform: `translateX(${-offset * 0.22}px) scale(1.001)`, filter: "brightness(0.95) blur(0.2px)", offset: 0.16 },
            { opacity: 0.22, transform: `translateX(${-offset * 0.64}px) scale(1.003)`, filter: "brightness(0.86) blur(0.7px)", offset: 0.32 },
            { opacity: 0.04, transform: `translateX(${-offset * 0.92}px) scale(1.004)`, filter: "brightness(0.78) blur(1.1px)", offset: 0.42 },
            { opacity: 0, transform: `translateX(${-offset}px) scale(1.005)`, filter: "brightness(0.74) blur(1.3px)", offset: 0.47 },
            { opacity: 0, transform: `translateX(${-offset}px) scale(1.006)`, filter: "brightness(0.74) blur(1.6px)", offset: 1 }
        ],
        {
            duration,
            easing: "cubic-bezier(0.22, 0.72, 0.28, 1)",
            fill: "forwards"
        }
    );

    // 下一頁：約 46% 後才開始淡入，形成「先淡出、再出現」的視覺
    const newAnim = img.animate(
        [
            { opacity: 0, transform: `translateX(${offset}px) scale(0.996)`, filter: "brightness(0.90) blur(1.2px)", offset: 0 },
            { opacity: 0, transform: `translateX(${offset}px) scale(0.996)`, filter: "brightness(0.90) blur(1.0px)", offset: 0.52 },
            { opacity: 0.12, transform: `translateX(${offset * 0.72}px) scale(0.997)`, filter: "brightness(0.94) blur(0.7px)", offset: 0.60 },
            { opacity: 0.58, transform: `translateX(${offset * 0.32}px) scale(0.999)`, filter: "brightness(0.98) blur(0.25px)", offset: 0.74 },
            { opacity: 0.88, transform: `translateX(${offset * 0.10}px) scale(0.9996)`, filter: "brightness(1) blur(0px)", offset: 0.86 },
            { opacity: 1, transform: "translateX(0) scale(1)", filter: "brightness(1) blur(0px)", offset: 1 }
        ],
        {
            duration,
            easing: "cubic-bezier(0.22, 0.72, 0.28, 1)",
            fill: "forwards"
        }
    );

    oldAnim.onfinish = () => oldImg.remove();
    newAnim.onfinish = () => {
        img.style.opacity = "1";
        img.style.transform = "translateX(0) scale(1)";
    };
}
function getSpread(view) {
    const start = (view - 1) * 2;
    return {
        left: innerImages[start] || "",
        right: innerImages[start + 1] || ""
    };
}

function totalViews() {
    return 1 + Math.ceil(innerImages.length / 2);
}

function resetTurningSheet() {
    turningSheet.classList.remove("turn-next", "turn-prev");
    turningSheet.style.display = "none";
    void turningSheet.offsetWidth;
}

function renderCurrentView() {
    book.classList.remove("opening-cover", "closing-cover");

    if (viewIndex === 0) {
        book.classList.add("cover-mode");
        setImage(rightPhoto, coverImage);
        setImage(leftPhoto, "");
    } else {
        book.classList.remove("cover-mode");
        const spread = getSpread(viewIndex);
        setImage(leftPhoto, spread.left);
        setImage(rightPhoto, spread.right);
    }

    updateControls();
    preloadNearbyImages();
}

function updateControls() {
    if (viewIndex === 0) {
        pageNo.textContent = `封面 / ${innerImages.length + 1}`;
    } else {
        const startPage = (viewIndex - 1) * 2 + 1;
        const endPage = Math.min(startPage + 1, innerImages.length);
        pageNo.textContent = `${startPage}－${endPage} / ${innerImages.length}`;
    }

    const canGoPrev = viewIndex > 0;
    const canGoNext = viewIndex < totalViews() - 1;

    prevButton.disabled = !canGoPrev || isAnimating;
    nextButton.disabled = !canGoNext || isAnimating;
    leftZone.style.pointerEvents = canGoPrev && !isAnimating ? "auto" : "none";
    rightZone.style.pointerEvents = canGoNext && !isAnimating ? "auto" : "none";
}

function restartLeftFlow(className) {
    const leftPage = leftPhoto.closest(".left-page");
    leftPage.classList.remove("left-flow-next", "left-flow-prev");
    void leftPage.offsetWidth;
    leftPage.classList.add(className);
}

function clearLeftFlow() {
    const leftPage = leftPhoto.closest(".left-page");
    leftPage.classList.remove("left-flow-next", "left-flow-prev");
}

function startRightUnderlay() {
    const rightPage = rightPhoto.closest(".right-page");
    rightPage.classList.remove("right-under-next");
    void rightPage.offsetWidth;
    rightPage.classList.add("right-under-next");
}

function clearRightUnderlay() {
    const rightPage = rightPhoto.closest(".right-page");
    rightPage.classList.remove("right-under-next");
}

function nextView() {
    if (isAnimating || viewIndex >= totalViews() - 1) return;

    isAnimating = true;
    updateControls();
    resetTurningSheet();

    if (viewIndex === 0) {
        /* 封面 0.png 打開到 1.png / 2.png */
        const nextSpread = getSpread(1);

        setImage(sheetFrontPhoto, coverImage);
        setImage(sheetPreviewPhoto, nextSpread.left);
        setImage(sheetBackPhoto, nextSpread.left);

        // 下一組右頁先放在翻頁紙張下方；紙張抬起時自然被看見。
        setImage(rightPhoto, nextSpread.right);
        // 先把右側下一頁完整鋪在翻頁紙張下方，再啟動翻頁。
        // 因此紙張從右側掀起的第一瞬間，就會自然露出下一頁。
        startRightUnderlay();

        restartLeftFlow("left-flow-next");

        book.classList.remove("cover-mode");
        book.classList.add("opening-cover");

        turningSheet.style.width = "50%";
        turningSheet.style.right = "0";
        turningSheet.style.left = "auto";
        turningSheet.style.display = "block";
        void turningSheet.offsetWidth;
        turningSheet.classList.add("turn-next");

        window.setTimeout(() => {
            viewIndex = 1;
            turningSheet.style.width = "";
            resetTurningSheet();
            clearRightUnderlay();
            isAnimating = false;
            renderCurrentView();
            triggerPageFlyIn("next");
        }, animationDuration);

        return;
    }

    const currentSpread = getSpread(viewIndex);
    const nextSpread = getSpread(viewIndex + 1);

    setImage(sheetFrontPhoto, currentSpread.right);
    setImage(sheetPreviewPhoto, nextSpread.left);
    setImage(sheetBackPhoto, nextSpread.left);

    // 下一組右頁預先放在翻動紙張下方。
    // 當目前右頁被掀起時，新右頁會隨著翻動縫隙自然露出，不會在最後一刻才跳出。
    setImage(rightPhoto, nextSpread.right);
    // 下一組右頁在動畫開始「之前」就已完成換圖並固定在底層。
    // 翻動紙張只負責遮住/揭露它，不再於動畫中途切換右頁圖片。
    startRightUnderlay();

    restartLeftFlow("left-flow-next");

    // 紙張翻過書脊後，背面已經顯示 nextSpread.left。
    // 此時翻頁紙張正好遮住左底頁，所以直接把左底頁換成同一張，
    // 動畫結束移除翻頁紙張時不會再發生第二次跳圖。
    window.setTimeout(() => {
        if (isAnimating) setImage(leftPhoto, nextSpread.left);
    }, Math.round(animationDuration * 0.53));

    turningSheet.style.width = "";
    turningSheet.style.right = "0";
    turningSheet.style.left = "auto";
    turningSheet.style.display = "block";
    void turningSheet.offsetWidth;
    turningSheet.classList.add("turn-next");

    window.setTimeout(() => {
        viewIndex++;
        resetTurningSheet();
        clearLeftFlow();
        clearRightUnderlay();
        isAnimating = false;
        renderCurrentView();
        triggerPageFlyIn("next");
    }, animationDuration);
}

function prevView() {
    if (isAnimating || viewIndex <= 0) return;

    isAnimating = true;
    updateControls();
    resetTurningSheet();

    if (viewIndex === 1) {
        /* 第一組內頁退回單頁封面 */
        const currentSpread = getSpread(1);

        setImage(sheetFrontPhoto, currentSpread.left);
        setImage(sheetPreviewPhoto, coverImage);
        setImage(sheetBackPhoto, coverImage);

        window.setTimeout(() => {
            if (isAnimating) crossfadeImage(leftPhoto, "", "prev", 680);
        }, Math.round(animationDuration * 0.12));

        window.setTimeout(() => {
            if (isAnimating) crossfadeImage(rightPhoto, coverImage, "prev", 720);
        }, Math.round(animationDuration * 0.50));

        restartLeftFlow("left-flow-prev");

        book.classList.add("closing-cover");

        turningSheet.style.width = "50%";
        turningSheet.style.left = "0";
        turningSheet.style.right = "auto";
        turningSheet.style.display = "block";
        void turningSheet.offsetWidth;
        turningSheet.classList.add("turn-prev");

        window.setTimeout(() => {
            viewIndex = 0;
            turningSheet.style.width = "";
            resetTurningSheet();
            isAnimating = false;
            renderCurrentView();
            triggerPageFlyIn("prev");
        }, animationDuration);

        return;
    }

    const currentSpread = getSpread(viewIndex);
    const prevSpread = getSpread(viewIndex - 1);

    setImage(sheetFrontPhoto, currentSpread.left);
    setImage(sheetPreviewPhoto, prevSpread.right);
    setImage(sheetBackPhoto, prevSpread.right);

    // 左底頁先以短暫交疊方式換入上一組左頁。
    window.setTimeout(() => {
        if (isAnimating) crossfadeImage(leftPhoto, prevSpread.left, "prev", 760);
    }, Math.round(animationDuration * 0.12));

    // 紙張翻過書脊後，背面已經顯示 prevSpread.right。
    // 趁翻頁紙張遮住右底頁時直接換成同一張，落頁時就完全連續。
    window.setTimeout(() => {
        if (isAnimating) setImage(rightPhoto, prevSpread.right);
    }, Math.round(animationDuration * 0.53));

    restartLeftFlow("left-flow-prev");

    turningSheet.style.width = "";
    turningSheet.style.left = "0";
    turningSheet.style.right = "auto";
    turningSheet.style.display = "block";
    void turningSheet.offsetWidth;
    turningSheet.classList.add("turn-prev");

    window.setTimeout(() => {
        viewIndex--;
        resetTurningSheet();
        clearLeftFlow();
        isAnimating = false;
        renderCurrentView();
        triggerPageFlyIn("prev");
    }, animationDuration);
}

function preload(src) {
    if (!src) return;
    const img = new Image();
    img.src = src;
}

function preloadNearbyImages() {
    preload(coverImage);
    if (viewIndex > 0) {
        const start = (viewIndex - 1) * 2;
        for (let i = start - 2; i <= start + 5; i++) {
            if (innerImages[i]) preload(innerImages[i]);
        }
    } else {
        innerImages.slice(0, 4).forEach(preload);
    }
}

prevButton.addEventListener("click", prevView);
nextButton.addEventListener("click", nextView);
leftZone.addEventListener("click", prevView);
rightZone.addEventListener("click", nextView);

document.addEventListener("keydown", (event) => {
    if (isAnimating) return;

    switch (event.key) {
        case "ArrowRight":
        case "PageDown":
        case " ":
            event.preventDefault();
            nextView();
            break;
        case "ArrowLeft":
        case "PageUp":
            event.preventDefault();
            prevView();
            break;
        case "Home":
            event.preventDefault();
            viewIndex = 0;
            renderCurrentView();
            break;
        case "End":
            event.preventDefault();
            viewIndex = totalViews() - 1;
            renderCurrentView();
            break;
    }
});

document.addEventListener("wheel", (event) => {
    event.preventDefault();
    if (wheelLocked || isAnimating) return;

    const movement = Math.abs(event.deltaX) > Math.abs(event.deltaY)
        ? event.deltaX
        : event.deltaY;

    if (movement === 0) return;

    wheelLocked = true;
    window.setTimeout(() => wheelLocked = false, animationDuration + 100);

    movement > 0 ? nextView() : prevView();
}, { passive: false });

document.addEventListener("touchstart", (event) => {
    if (!event.changedTouches.length) return;
    touchStartX = event.changedTouches[0].clientX;
    touchStartY = event.changedTouches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", (event) => {
    if (isAnimating || !event.changedTouches.length) return;

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;
    const diffX = touchStartX - endX;
    const diffY = touchStartY - endY;

    if (Math.abs(diffY) > Math.abs(diffX) || Math.abs(diffX) < 55) return;
    diffX > 0 ? nextView() : prevView();
}, { passive: true });

document.addEventListener("pointerdown", (event) => {
    if (event.target.closest(".controls")) return;
    pointerStartX = event.clientX;
    pointerStartY = event.clientY;
    isPointerDown = true;
});

document.addEventListener("pointerup", (event) => {
    if (!isPointerDown || isAnimating) {
        isPointerDown = false;
        return;
    }

    isPointerDown = false;
    const diffX = pointerStartX - event.clientX;
    const diffY = pointerStartY - event.clientY;

    if (Math.abs(diffX) < 80 || Math.abs(diffY) > Math.abs(diffX)) return;
    diffX > 0 ? nextView() : prevView();
});

function handleImageError(event) {
    console.error("圖片載入失敗：", event.target.src);
}

[leftPhoto, rightPhoto, sheetFrontPhoto, sheetPreviewPhoto, sheetBackPhoto].forEach(img => {
    img.addEventListener("error", handleImageError);
});

window.setTimeout(() => {
    helpText.style.opacity = "0";
}, 5000);



function triggerFlyIn(imageElement, direction) {
    imageElement.classList.remove('fly-in-next', 'fly-in-prev');
    void imageElement.offsetWidth;
    imageElement.classList.add(direction === 'prev' ? 'fly-in-prev' : 'fly-in-next');
}

function triggerPageFlyIn(direction) {
    // 翻頁完成後，左右新頁一起飛入；封面模式只讓右頁飛入。
    if (viewIndex === 0) {
        triggerFlyIn(rightPhoto, direction);
    } else {
        triggerFlyIn(leftPhoto, direction);
        window.setTimeout(() => triggerFlyIn(rightPhoto, direction), 55);
    }
}

function initializeBook() {
    viewIndex = 0;
    resetTurningSheet();
    renderCurrentView();
}

initializeBook();
</script>
