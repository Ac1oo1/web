<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格特質問卷</title>

<style>
body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:#f5f5f5;
    margin:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
}

.question{
    margin:20px 0;
    padding:15px;
    border-bottom:1px solid #ddd;
}

.options{
    margin-top:10px;
}

label{
    margin-right:18px;
    cursor:pointer;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    background:#1976d2;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#125aa0;
}

.result{
    margin-top:30px;
    padding:20px;
    background:#eef7ff;
    border-radius:8px;
    font-size:22px;
    text-align:center;
    display:none;
}

.result img{
    margin-top:20px;
    max-width:100%;
    width:500px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.25);
}
</style>

</head>

<body>

<div class="container">

<h1>人格特質問卷</h1>

<div id="survey"></div>

<button onclick="calculateScore()">查看角色</button>

<div class="result" id="result"></div>

</div>

<script>

const questions=[
"你向來樂於廣結善緣，對結交新朋友一事樂此不疲。",
"你盡情享受探索那些別出心裁、不熟悉的想法和觀點。",
"面對截止日期的壓力，你常常感到焦頭爛額，難以按時完成任務。",
"在與人相處時，你會優先考慮體諒他人的感受，而不是完全直率地表達事實。",
"你熱衷於參與團隊活動。",
"你不太在意自己是否能給陌生人留下好印象。",
"你時常擔心事情會朝著更糟的方向發展。",
"在社交聚會上，你通常會等待別人先主動介紹自己。",
"你經常等到最後一刻才開始處理重要的事情。",
"朋友們通常會形容你是個活潑開朗的人。",
"做決定時，你更傾向依據客觀事實，而非一時的情感感受。",
"對於探討世界未來發展或抽象理論的話題，你通常興趣不大。"
];

const survey=document.getElementById("survey");

questions.forEach((q,index)=>{

let html=`
<div class="question">
<b>第${index+1}題：</b>${q}
<div class="options">
`;

for(let i=1;i<=4;i++){

let text="";

switch(i){
    case 1:text="不同意";break;
    case 2:text="有點不同意";break;
    case 3:text="有點同意";break;
    case 4:text="同意";break;
}

html+=`
<label>
<input type="radio" name="q${index}" value="${i}">
${i} ${text}
</label>
`;
}

html+=`
</div>
</div>
`;

survey.innerHTML+=html;

});

function calculateScore(){

let total=0;

for(let i=0;i<questions.length;i++){

const ans=document.querySelector(`input[name=q${i}]:checked`);

if(!ans){
    alert(`第 ${i+1} 題尚未作答`);
    return;
}

total+=Number(ans.value);

}

const avg=(total/questions.length).toFixed(2);

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`
<h2>





<hr>

<h3><test src="${total}.txt" alt"=></h3>

<img src="a${total}.png" alt="結果圖片">
`;

}

</script>

</body>
</html>
