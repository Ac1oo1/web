/* =====================================================
   建立題目
   ===================================================== */

const survey = document.getElementById("survey");

let html = "";


questions.forEach((q, index) => {

    html += `
        <div class="question">

            <b>第${index + 1}題：</b>

            ${q}

            <div class="options">
    `;


    for(let i = 1; i <= 4; i++){

        let text = "";

        switch(i){

            case 1:
                text = "不同意";
                break;

            case 2:
                text = "有點不同意";
                break;

            case 3:
                text = "有點同意";
                break;

            case 4:
                text = "同意";
                break;

        }


        html += `
            <label>

                <input
                    type="radio"
                    name="q${index}"
                    value="${i}"
                >

                ${i} ${text}

            </label>
        `;

    }


    html += `
            </div>

        </div>
    `;

});


survey.innerHTML = html;


/* =====================================================
   計算分數
   ===================================================== */

function calculateScore(){

    let total = 0;


    for(let i = 0; i < questions.length; i++){

        const ans = document.querySelector(
            `input[name="q${i}"]:checked`
        );


        if(!ans){

            alert("還有沒作答的o，仔細檢查看看?");

            return;

        }


        let value = Number(ans.value);


        /* 反向計分 */

        if(REVERSE_ITEMS.includes(i)){

            value = 5 - value;

        }


        total += value;

    }


    /* 取得結果 */

    const result = RESULTS[total];


    if(!result){

        alert("找不到這個分數的結果：" + total);

        return;

    }


    /* 顯示結果 */

    document.getElementById("resultTitle").textContent =
        result.title;


    document.getElementById("resultText").textContent =
        result.text;


    const resultImage =
        document.getElementById("resultImage");


    resultImage.style.display = "block";

    resultImage.src = result.image;

    resultImage.alt = result.title;


    document.getElementById("result").style.display =
        "block";


    /* 自動捲到結果 */

    document.getElementById("result").scrollIntoView({
        behavior:"smooth"
    });

}
