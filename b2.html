// ============================================
// 4. 自動產生題目
// ============================================
const survey = document.getElementById("survey");

questions.forEach((question, index) => {
    const section = document.createElement("div");
    section.className = "question";

    const title = document.createElement("b");
    title.textContent = `第${index + 1}題：`;

    section.appendChild(title);
    section.appendChild(
        document.createTextNode(question)
    );

    const options = document.createElement("div");
    options.className = "options";

    const optionTexts = [
        "不同意",
        "有點不同意",
        "有點同意",
        "同意"
    ];

    optionTexts.forEach((text, i) => {
        const label = document.createElement("label");
        const input = document.createElement("input");

        input.type = "radio";
        input.name = `q${index}`;
        input.value = String(i + 1);

        label.appendChild(input);
        label.appendChild(
            document.createTextNode(` ${i + 1} ${text}`)
        );

        options.appendChild(label);
    });

    section.appendChild(options);
    survey.appendChild(section);
});

// ============================================
// 5. 計算分數、顯示結果、傳送紀錄
// ============================================
let submitted = false;

async function calculateScore() {
    if (submitted) {
        alert("這份測驗已經提交，請勿重複提交。");
        return;
    }

    let total = 0;
    const answers = [];

    for (let i = 0; i < questions.length; i++) {
        const answer = document.querySelector(
            `input[name="q${i}"]:checked`
        );

        if (!answer) {
            alert(`第${i + 1}題尚未作答，請完成所有題目！`);

            document.querySelector(
                `.question:nth-child(${i + 1})`
            ).scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

            return;
        }

        const selected = Number(answer.value);
        answers.push(selected);

        const value = REVERSE_ITEMS.includes(i)
            ? 5 - selected
            : selected;

        total += value;
    }

    const result = RESULTS[total];

    if (!result) {
        alert("找不到對應的結果，請檢查程式設定。");
        return;
    }

    // 顯示結果，不顯示分數
    document.getElementById("resultTitle").textContent =
        result.title;

    document.getElementById("resultText").textContent =
        result.text;

    const image = document.getElementById("resultImage");
    image.src = result.image;
    image.alt = result.title;

    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });

    // 檢查網址是否已經設定
    if (
        !GOOGLE_SCRIPT_URL.startsWith(
            "https://script.google.com/macros/s/"
        ) ||
        !GOOGLE_SCRIPT_URL.endsWith("/exec")
    ) {
        document.getElementById("saveStatus").textContent =
            "測驗結果已顯示，但尚未設定正確的 Google Apps Script 網址。";

        return;
    }

    const button = document.getElementById("submitButton");
    const status = document.getElementById("saveStatus");

    button.disabled = true;
    button.textContent = "正在提交資料…";
    status.textContent = "正在傳送作答紀錄，請稍候。";

    try {
        const formData = new URLSearchParams();

        formData.append("data", JSON.stringify({
            answers: answers,
            score: total,
            result: result.title
        }));

        // no-cors 模式不能讀取伺服器回應。
        // 因此 fetch 完成不代表試算表一定已寫入。
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });

        submitted = true;

        status.textContent =
            "資料已送出。請管理者確認 Google 試算表是否新增紀錄。";

        button.textContent = "已提交";

    } catch (error) {
        console.error("提交失敗：", error);

        status.textContent =
            "傳送失敗，請檢查網路、部署網址及 Apps Script 設定。";

        button.disabled = false;
        button.textContent = "重新提交";
    }
}
